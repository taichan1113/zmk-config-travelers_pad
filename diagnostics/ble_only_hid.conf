# Diagnostic: keep USB CDC logging, but route all HID through BLE.
# 診断用: USB CDCログは維持し、HIDはBLEだけにする。
CONFIG_ZMK_USB=n
CONFIG_USB_DEVICE_HID=n
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
# Sample frequently during the power/connection investigation.
# 電源・接続の調査中は残量測定を短い間隔で記録する。
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=5
