# Apply after ble_only_hid.conf. Diagnostic only, not a confirmed fix.
# ble_only_hid.confの後に適用する診断用設定。原因確定・正式修正ではない。
# The input thread calls recognizers/listeners and enqueues BLE HID reports.
# 入力threadは認識器・listener・BLE HID enqueueを呼ぶ。
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_LOG_LEVEL_INF=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048
