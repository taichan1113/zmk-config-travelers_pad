description: Travelers Pad IQS9150 exclusive multi-finger gesture router

compatible: "zmk,travelers-pad-iqs9150-multifinger-router"

include: base.yaml

properties:
  input-device:
    type: phandle
    required: true
    description: Raw IQS9150 contact input device
  scroll-classify-move:
    type: int
    default: 35
    description: Minimum movement required from each direction-coherent contact before committing two-finger scroll
  geometry-distance-threshold:
    type: int
    default: 30000
    description: Squared-distance change that claims pinch geometry
  geometry-rotation-threshold:
    type: int
    default: 30000
    description: Cross-product magnitude that claims rotation geometry
