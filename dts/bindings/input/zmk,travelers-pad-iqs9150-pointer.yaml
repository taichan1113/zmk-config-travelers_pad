description: Travelers Pad IQS9150 pointer and scroll function

compatible: "zmk,travelers-pad-iqs9150-pointer"

include: base.yaml

properties:
  input-device:
    type: phandle
    required: true
    description: IQS9150 raw contact input device
  scroll-divisor:
    type: int
    default: 4
    description: Divide accumulated two-finger coordinate deltas before wheel output
  scroll-axis-lock-min-move:
    type: int
    default: 12
    description: >
      Accumulated coordinate movement required before locking a two-finger
      scroll axis. 2本指スクロールの軸を決定するまでに蓄積する座標移動量。
  scroll-axis-lock-ratio:
    type: int
    default: 2
    description: >
      Horizontal-to-vertical ratio required to choose horizontal scrolling;
      otherwise vertical is selected. 横スクロールを選ぶために必要な横/縦移動比。
      それ以外は縦スクロールを選ぶ。
  scroll-max-frame-delta:
    type: int
    default: 128
    description: >
      Per-frame coordinate delta above which a scroll frame is discarded and
      rebased. この値を超える1フレーム差分は破棄して座標基準を更新する。
  scroll-invert-vertical:
    type: boolean
    description: >
      Reverse the vertical two-finger scroll direction. This is a keyboard
      configuration option; omitted means the standard direction. 2本指の
      縦スクロール方向を反転する。省略時は標準方向となるキーボード設定項目。
  scroll-invert-horizontal:
    type: boolean
    description: >
      Reverse the horizontal two-finger scroll direction. This is a keyboard
      configuration option; omitted means the standard direction. 2本指の
      横スクロール方向を反転する。省略時は標準方向となるキーボード設定項目。
