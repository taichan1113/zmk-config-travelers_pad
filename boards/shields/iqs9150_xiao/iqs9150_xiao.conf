CONFIG_IQS9150_EV02_DRIVER=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_LOG=y
CONFIG_IQS9150_EV02_DRIVER_LOG_LEVEL_INF=y
# A five-contact frame can carry slot, tracking, and X/Y events plus the
# legacy pointer frame. Keep one complete frame in the asynchronous queue.
# 5点フレームと既存ポインタフレームを丸ごと収容できる入力キュー容量にする。
CONFIG_INPUT_QUEUE_MAX_MSGS=64
# BLE input processing exceeded the default 512-byte input stack in hardware
# diagnostics (768 bytes observed). Reserve headroom for the full listener chain.
# 実機BLE診断で入力stack使用量768バイトを観測。既定512バイトでは不足するため、
# listener全体の処理に余裕を確保し、overflow検出も有効にする。
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_HW_STACK_PROTECTION=y

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=5
CONFIG_RGBLED_WIDGET_CONN_SHOW_USB=n
