description: Travelers Pad IQS9150 pointer and scroll function

compatible: "zmk,travelers-pad-iqs9150-pointer"

include: base.yaml

properties:
  input-device:
    type: phandle
    required: true
    description: IQS9150 raw contact input device
  scroll-divisor:
    type: int
    default: 4
    description: Divide two-finger coordinate deltas before wheel output
