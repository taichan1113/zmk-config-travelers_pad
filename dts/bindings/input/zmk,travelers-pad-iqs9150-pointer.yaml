description: Travelers Pad IQS9150 pointer, scroll, and tap function

compatible: "zmk,travelers-pad-iqs9150-pointer"

include: base.yaml

properties:
  input-device:
    type: phandle
    required: true
    description: IQS9150 raw contact input device
  scroll-divisor:
    type: int
    default: 4
    description: Divide two-finger coordinate deltas before wheel output
  tap-max-ms:
    type: int
    default: 350
    description: Maximum contact duration for a tap
  tap-max-move:
    type: int
    default: 75
    description: Maximum absolute coordinate movement for a tap
